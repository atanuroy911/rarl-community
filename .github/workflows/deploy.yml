name: Deploy to cPanel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Quality gate: nothing reaches the live site unless every check passes.
  checks:
    name: Checks (${{ matrix.db }})
    runs-on: ubuntu-latest
    # MySQL 8 reports problems without blocking (the server runs MariaDB); MariaDB must pass.
    continue-on-error: ${{ matrix.db == 'mysql:8.0' }}
    strategy:
      fail-fast: false
      matrix:
        db: ['mysql:8.0', 'mariadb:10.11']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: rarl_ci
          MARIADB_DATABASE: rarl_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: rarl_ci
      DB_USER: root
      DB_PASS: root
      SITE_URL: http://127.0.0.1:8123
      MAIN_SITE_URL: http://127.0.0.1:8123
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'   # same as the server
          extensions: pdo_mysql, mbstring, gd, zip, fileinfo, openssl, curl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PHP syntax (every file)
        run: |
          find . -name '*.php' -not -path './libs/*' -print0 | xargs -0 -n1 -P4 php -l > /tmp/lint.txt || { grep -v '^No syntax errors' /tmp/lint.txt; exit 1; }
          echo "$(wc -l < /tmp/lint.txt) files OK"

      - name: Database builds from schema.sql and re-syncs cleanly
        run: php tests/ci-db.php

      - name: Smoke test every page (PHP errors and inline scripts)
        run: |
          export ADMIN_PASSWORD_HASH="$(php -r 'echo password_hash("ci-admin", PASSWORD_DEFAULT);')"
          bash tests/smoke.sh

  deploy:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deploy.zip
        run: |
          mkdir -p /tmp/deploy-stage
          zip -rq /tmp/deploy-stage/deploy.zip . \
            -x ".git/*" ".git*" \
            -x ".github/*" ".github/**" \
            -x "tests/*" "tests/**" \
            -x "node_modules/*" "node_modules/**" \
            -x "libs/phpqrcode/cache/*" "libs/phpqrcode/cache/**" \
            -x "uploads/avatars/*" "uploads/avatars/**" \
            -x "uploads/certificates/*" "uploads/certificates/**" \
            -x "uploads/templates/*" "uploads/templates/**" \
            -x "uploads/cv/*" "uploads/cv/**" \
            -x "uploads/id-cards/*" "uploads/id-cards/**" \
            -x "uploads/people/*" "uploads/people/**" \
            -x ".env" ".env.sample" ".env.production"
          cp deploy-extract.php /tmp/deploy-stage/deploy-extract.php

      - name: Upload deploy.zip + extractor over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ secrets.CPANEL_FTP_SERVER_DIR }}
          protocol: ftps
          local-dir: /tmp/deploy-stage/

      - name: Trigger server-side extraction
        run: |
          curl -fsS "${{ secrets.CPANEL_SITE_URL }}/deploy-extract.php?token=${{ secrets.DEPLOY_TOKEN }}"
