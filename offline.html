<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CC0703">
<title>You're offline — RARL</title>
<link rel="icon" href="assets/icons/favicon-32.png">
<style>
  :root { color-scheme: light dark; --bg:#f4f2ee; --card:#fff; --fg:#111827; --muted:#565d6b; --red:#CC0703; }
  @media (prefers-color-scheme: dark) { :root { --bg:#030712; --card:#111827; --fg:#f3f4f6; --muted:#9ca3af; --red:#ff6b66; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg);
         font:16px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; }
  main { max-width:420px; width:100%; background:var(--card); border-radius:24px; padding:32px 28px; text-align:center; box-shadow:0 20px 60px -30px rgba(0,0,0,.35); }
  img { width:64px; height:64px; border-radius:16px; }
  h1 { font-size:1.4rem; margin:18px 0 6px; letter-spacing:-.01em; }
  p { color:var(--muted); margin:0 0 22px; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button, a { min-height:44px; padding:0 20px; border-radius:999px; font:600 15px/44px inherit; text-decoration:none; border:1px solid transparent; cursor:pointer; }
  button { background:var(--red); color:#fff; }
  a { color:var(--fg); border-color:rgba(127,127,127,.35); }
</style>
</head>
<body>
<main>
  <img src="assets/icons/icon-192.png" alt="RARL">
  <h1>You're offline</h1>
  <p>This page isn't saved on your device yet. Pages you've opened recently, like your Home, membership card and events, still work offline.</p>
  <div class="row">
    <button type="button" onclick="location.reload()">Try again</button>
    <a href="dashboard.php">Open Home</a>
  </div>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
