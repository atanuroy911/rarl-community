<!-- ============================================================
     Robotics & Automation Research Lab (RARL) — Slim Announcement Banner (place just below your nav)
     Paste into a WordPress Custom HTML block (or Classic Editor "Text" tab).
     Needs one small <style> block for the animation — inline style="" can't
     express @keyframes. Scoped to #rarl-banner so it won't affect your theme.
     ============================================================ -->
<style>
  @keyframes rarlBreathe {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes rarlPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.35); }
    50%      { box-shadow: 0 0 0 6px rgba(255,255,255,0); }
  }
  #rarl-banner {
    background: linear-gradient(270deg, #12213a, #c8102e, #1c3358, #c8102e, #12213a);
    background-size: 400% 400%;
    animation: rarlBreathe 10s ease-in-out infinite;
  }
  #rarl-banner .rarl-banner-cta {
    animation: rarlPulse 2.4s ease-in-out infinite;
  }
  #rarl-banner td {
    border: 0 !important;
  }
  @media (max-width: 640px) {
    #rarl-banner .rarl-banner-row { display: block !important; text-align: center !important; }
    #rarl-banner .rarl-banner-text { display: block !important; margin: 0 0 12px !important; }
  }
</style>

<div id="rarl-banner" style="width:100%; padding:14px 20px; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" class="rarl-banner-row" width="100%" style="max-width:1100px; margin:0 auto; border-collapse:collapse;">
    <tr>
      <td class="rarl-banner-text" style="color:#ffffff; font-size:14px; font-weight:600; text-align:left; vertical-align:middle; padding-right:16px;">
        🔬 Join the RARL Research Community — free membership for your first year.
      </td>
      <td style="text-align:right; vertical-align:middle; white-space:nowrap;">
        <a href="https://community.rarl-lab.com/register.php" class="rarl-banner-cta" style="display:inline-block; background:#ffffff; color:#c8102e; font-weight:700; font-size:13px; text-decoration:none; padding:8px 20px; border-radius:999px;" target="_blank">
          Join Now →
        </a>
      </td>
    </tr>
  </table>
</div>
